# semgrep --test 用の fixture (src/security_checker/rules/semgrep/ci-lock.yml)。workflow として実行はしない。
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ruleid: ci-uv-sync-without-locked
      - run: uv sync
      - name: 複数行のスクリプトの途中にあっても拾う
        # ruleid: ci-uv-sync-without-locked
        run: |
          set -euo pipefail
          uv sync --group dev
          uv run pytest
      # ok: ci-uv-sync-without-locked
      - run: uv sync --locked
      # ruleid: ci-uv-sync-frozen-without-locked
      - run: uv sync --group dev --frozen
      # ok: ci-uv-sync-frozen-without-locked
      - run: uv sync --frozen --locked
      # ok: ci-uv-sync-without-locked
      - run: uv run pytest

  relock:
    # lock を更新するための job は対象外
    runs-on: ubuntu-latest
    steps:
      - run: uv lock --upgrade
      # ok: ci-uv-sync-without-locked
      - run: uv sync

  continuation:
    runs-on: ubuntu-latest
    steps:
      # 行継続で次の行に書いた --locked も見る (#285)
      # ok: ci-uv-sync-without-locked
      - run: |
          uv sync \
            --locked --group dev
      # ruleid: ci-uv-sync-without-locked
      - run: |
          uv sync \
            --group dev

  step-env:
    runs-on: ubuntu-latest
    steps:
      # 環境変数 UV_LOCKED は --locked と同じ意味 (#286)
      # ok: ci-uv-sync-without-locked
      - run: uv sync
        env:
          UV_LOCKED: "1"

  job-env:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      # ok: ci-uv-sync-without-locked
      - run: uv sync

  env-not-truthy:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "0"
    steps:
      # 値が真でなければ lock は強制されていない. 書くだけで指摘を消せない
      # ruleid: ci-uv-sync-without-locked
      - run: uv sync

  env-expression:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: ${{ vars.LOCKED }}
    steps:
      # 式は値が分からないので、外さない
      # ruleid: ci-uv-sync-without-locked
      - run: uv sync

  env-true:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: true
    steps:
      # ok: ci-uv-sync-without-locked
      - run: uv sync

  env-one-unquoted:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: 1
    steps:
      # ok: ci-uv-sync-without-locked
      - run: uv sync
