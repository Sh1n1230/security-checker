id: hand-cpp-format-literal
source: handmade
language: cpp
candidate:
  scanner: semgrep
  rule_id: handmade.cpp.format-string-audit
  category: sast
  message: Review the security-sensitive operation in its surrounding context.
  path: app/cpp_format_literal.cpp
  start_line: 6
  end_line: 6
  severity_reported: high
  cwe:
  - CWE-134
code: |
  #include <cstdio>
  #include <cstring>

  int main(int argc, char **argv) {
      if (argc != 2) return 1;
      std::printf("%s", argv[1]);
      return 0;
  }
ground_truth:
  vulnerable: false
  cwe: []
  severity: none
  rationale: |
    The format string is the fixed literal %s and the untrusted command-line
    argument is its data argument. Percent directives in that argument are printed
    as text rather than interpreted as formatting instructions.
