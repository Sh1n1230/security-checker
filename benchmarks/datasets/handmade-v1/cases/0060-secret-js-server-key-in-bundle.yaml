# 真陽性: サーバ専用の API キーをフロントエンドのコードに埋めている。
id: hand-0060
source: handmade
language: javascript
candidate:
  scanner: gitleaks
  rule_id: generic-api-key
  category: secret
  message: API キーらしき文字列が含まれています
  path: web/src/api/mail.js
  start_line: 2
  end_line: 2
  severity_reported: high
  cwe:
  - CWE-798
code: |
  // 問い合わせフォームからメール送信 API を直接呼ぶ
  const MAIL_API_KEY = "dataset-placeholder-mail-server-key";

  export async function sendInquiry(form) {
    return fetch("https://api.mail.example.com/v3/send", {
      method: "POST",
      headers: { Authorization: `Bearer ${MAIL_API_KEY}` },
      body: JSON.stringify(form),
    });
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-798
  severity: high
  rationale: |
    メール送信サービスのサーバ用キーをブラウザ向けバンドルに含めている (値はデータセット用のダミーに置き換えてある)。サイトを開いた
    誰でも開発者ツールで取り出せ、ドメイン名義で任意のメールを送れる (スパム・フィッシング)。
    サーバ側のエンドポイント経由にすべき。
