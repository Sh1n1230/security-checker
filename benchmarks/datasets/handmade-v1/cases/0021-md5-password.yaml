# 真陽性: パスワードを salt 無しの MD5 で保存している。
id: hand-0021
source: handmade
language: python
candidate:
  scanner: semgrep
  rule_id: python.lang.security.audit.md5-used-as-password
  category: sast
  message: MD5 をパスワードのハッシュに使っています
  path: app/accounts.py
  start_line: 5
  end_line: 5
  severity_reported: medium
  cwe:
  - CWE-916
code: |
  import hashlib


  def create_user(db, email: str, password: str) -> None:
      digest = hashlib.md5(password.encode()).hexdigest()
      db.execute("INSERT INTO users (email, password_hash) VALUES (?, ?)", (email, digest))
ground_truth:
  vulnerable: true
  cwe:
  - CWE-916
  severity: medium
  rationale: |
    salt 無しの高速ハッシュで、DB が漏れると辞書攻撃・レインボーテーブルで大半のパスワードが
    短時間で復元される。DB の漏洩が前提条件になるため medium。bcrypt / argon2 にすべき。
