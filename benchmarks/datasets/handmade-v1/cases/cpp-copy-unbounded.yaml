id: hand-cpp-copy-unbounded
source: handmade
language: cpp
candidate:
  scanner: semgrep
  rule_id: handmade.cpp.string-copy-audit
  category: sast
  message: Review the security-sensitive operation in its surrounding context.
  path: app/cpp_copy_unbounded.cpp
  start_line: 7
  end_line: 7
  severity_reported: high
  cwe:
  - CWE-120
code: |
  #include <cstdio>
  #include <cstring>

  int main(int argc, char **argv) {
      if (argc != 2) return 1;
      char label[16];
      std::strcpy(label, argv[1]);
      std::puts(label);
      return 0;
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-120
  severity: high
  rationale: |
    An arbitrary-length command-line string is copied into a sixteen-byte stack
    array without checking its length. Fifteen non-NUL bytes fit; a longer value
    writes beyond the destination once the terminator is included.
