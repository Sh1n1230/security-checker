# 真陽性: 電卓機能でクエリ値を eval している。
id: hand-0013
source: handmade
language: python
candidate:
  scanner: semgrep
  rule_id: python.lang.security.audit.eval-detected
  category: sast
  message: eval にユーザー入力が渡っています
  path: app/calc.py
  start_line: 10
  end_line: 10
  severity_reported: high
  cwe:
  - CWE-95
code: |
  from flask import Flask, request

  app = Flask(__name__)


  @app.get("/calc")
  def calc():
      expr = request.args.get("expr", "0")
      # 四則演算だけのつもり
      return {"result": eval(expr, {"__builtins__": {}})}
ground_truth:
  vulnerable: true
  cwe:
  - CWE-95
  severity: critical
  rationale: |
    __builtins__ を空にしても、`().__class__.__mro__[1].__subclasses__()` のような属性辿りで
    任意のクラスに到達でき、サンドボックスにならない。認証不要の任意コード実行。
