  severity: critical
  rationale: |
    Cookie はクライアントが自由に書き換えられる。署名の検証も無く pickle.loads に渡しているため、
    __reduce__ を仕込んだペイロードで認証なしに任意コードを実行できる。スキャナの medium は過小。
