id: hand-swift-userdefaults-password
source: handmade
language: swift
candidate:
  scanner: semgrep
  rule_id: swift.lang.storage.sensitive-storage-userdefaults.swift-user-defaults
  category: sast
  message: Review the security-sensitive operation in its surrounding context.
  path: app/swift_userdefaults_password.swift
  start_line: 5
  end_line: 5
  severity_reported: high
  cwe:
  - CWE-312
code: |
  import Foundation

  // Called after the user supplies their account password at sign-in.
  func rememberPassword(_ password: String) {
      UserDefaults.standard.set(password, forKey: "accountPassword")
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-312
  severity: high
  rationale: |
    A real account password is persisted in the preferences store. UserDefaults
    is not a credential vault; storing the password there exposes it to readers
    of that app's preferences. Credential storage should use an appropriate
    protected facility or avoid retaining the password.
