# 真陽性: 本番 DB のパスワードを設定モジュールに直書き。
id: hand-0053
source: handmade
language: python
candidate:
  scanner: gitleaks
  rule_id: generic-password
  category: secret
  message: パスワードらしき文字列が含まれています
  path: config/production.py
  start_line: 10
  end_line: 10
  severity_reported: high
  cwe:
  - CWE-798
code: |
  DEBUG = False
  ALLOWED_HOSTS = ["shop.example.com"]

  DATABASES = {
      "default": {
          "ENGINE": "django.db.backends.postgresql",
          "HOST": "prod-db.internal",
          "NAME": "shop",
          "USER": "shop_app",
          "PASSWORD": "dataset-placeholder-prod-password",
      }
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-798
  severity: high
  rationale: |
    本番設定ファイルに本番 DB の資格情報が直書きされ、リポジトリを読める全員に渡る (値はデータセット用のダミーに置き換えてある)。
    DB が内部ネットワークにあるため即座の外部悪用には前提が要るが、内部への足がかりがあれば
    全データに到達できる。環境変数かシークレットマネージャから読むべき。
