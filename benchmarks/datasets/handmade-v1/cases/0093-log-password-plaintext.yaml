# 真陽性: ログイン失敗時に入力されたパスワードを平文でログに出す。
id: hand-0093
source: handmade
language: python
candidate:
  scanner: semgrep
  rule_id: python.lang.security.audit.logging.logger-credential-leak
  category: sast
  message: 資格情報をログに出力しています
  path: app/login.py
  start_line: 11
  end_line: 11
  severity_reported: medium
  cwe:
  - CWE-532
code: |
  import logging

  from flask import request

  logger = logging.getLogger(__name__)


  def on_failed_login():
      username = request.form.get("username")
      password = request.form.get("password")
      logger.info("login failed user=%s password=%s", username, password)
ground_truth:
  vulnerable: true
  cwe:
  - CWE-532
  severity: medium
  rationale: |
    失敗したログインの入力値には、打ち間違えた本物のパスワード (や別サービスのパスワード) が
    含まれる。ログ基盤を読める運用者・ログの漏洩経路から資格情報が漏れる。
