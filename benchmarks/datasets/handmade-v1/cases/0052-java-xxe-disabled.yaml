# 誤検知: DocumentBuilderFactory で DTD と外部実体を無効化している。
id: hand-0052
source: handmade
language: java
candidate:
  scanner: semgrep
  rule_id: java.lang.security.audit.xxe.documentbuilderfactory-disallow-doctype-decl-missing
  category: sast
  message: XML パーサが XXE に対して保護されていない可能性があります
  path: src/main/java/com/example/xml/Parser.java
  start_line: 12
  end_line: 12
  severity_reported: medium
  cwe:
  - CWE-611
code: |
  package com.example.xml;

  import javax.xml.parsers.DocumentBuilder;
  import javax.xml.parsers.DocumentBuilderFactory;

  public final class Parser {
      public static DocumentBuilder newBuilder() throws Exception {
          DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();
          factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          factory.setXIncludeAware(false);
          factory.setExpandEntityReferences(false);
          return factory.newDocumentBuilder();
      }
  }
ground_truth:
  vulnerable: false
  cwe: []
  severity: none
  rationale: |
    disallow-doctype-decl を true にしており、DOCTYPE 宣言自体が拒否されるので外部実体も
    entity expansion も成立しない。OWASP の推奨設定どおり。
