id: hand-kotlin-md5-password
source: handmade
language: kotlin
candidate:
  scanner: semgrep
  rule_id: kotlin.lang.security.use-of-md5
  category: sast
  message: Review the security-sensitive operation in its surrounding context.
  path: app/kotlin_md5_password.kt
  start_line: 5
  end_line: 5
  severity_reported: high
  cwe:
  - CWE-916
code: |
  import java.security.MessageDigest

  // Called by the account registration service before persisting passwordHash.
  fun passwordHash(password: String): String {
      val digest = MessageDigest.getInstance("MD5").digest(password.toByteArray(Charsets.UTF_8))
      return digest.joinToString("") { "%02x".format(it) }
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-916
  severity: high
  rationale: |
    The digest is the persisted password verifier. Fast, unsalted MD5 allows
    cheap offline guessing if those verifiers are obtained. This is a password
    storage weakness, not merely an objection to MD5's use in any context.
