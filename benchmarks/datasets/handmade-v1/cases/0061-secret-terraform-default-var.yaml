# 真陽性: Terraform の変数の default に本番の DB パスワード。
id: hand-0061
source: handmade
language: hcl
candidate:
  scanner: gitleaks
  rule_id: generic-password
  category: secret
  message: パスワードらしき文字列が含まれています
  path: infra/rds.tf
  start_line: 3
  end_line: 3
  severity_reported: high
  cwe:
  - CWE-798
code: |
  variable "db_password" {
    type    = string
    default = "dataset-placeholder-rds-master"
  }

  resource "aws_db_instance" "main" {
    identifier        = "prod-main"
    engine            = "postgres"
    instance_class    = "db.t3.medium"
    username          = "admin"
    password          = var.db_password
    allocated_storage = 50
  }
ground_truth:
  vulnerable: true
  cwe:
  - CWE-798
  severity: high
  rationale: |
    本番 RDS のマスターパスワードが変数の既定値として平文でコミットされている (値はデータセット用のダミーに置き換えてある)。
    さらに tfstate にも残る。sensitive な変数として外部から渡すか、Secrets Manager を使うべき。
