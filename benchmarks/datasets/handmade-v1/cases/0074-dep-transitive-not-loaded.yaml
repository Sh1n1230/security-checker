# 誤検知: 推移的依存の任意機能 (オプショナル extra) で、インストールされていない。
id: hand-0074
source: handmade
language: python
candidate:
  scanner: osv
  rule_id: GHSA-dataset-optional-0005
  category: dependency
  message: lockfile 上の imagelib-extras に既知の脆弱性があります
  path: poetry.lock
  start_line: 2
  end_line: 2
  severity_reported: high
  cwe:
  - CWE-787
code: |
  [[package]]
  name = "imagelib-extras"
  version = "0.9.0"
  optional = true

  [extras]
  heif = ["imagelib-extras"]

  # pyproject.toml の依存は `imagelib = "^2"` のみで、heif extra は指定していない
ground_truth:
  vulnerable: false
  cwe: []
  severity: none
  rationale: |
    lockfile にはオプショナルとして載っているが、このプロジェクトは heif extra を有効にしておらず
    実際にはインストールされない。インストールされないパッケージの脆弱性には到達しない。
