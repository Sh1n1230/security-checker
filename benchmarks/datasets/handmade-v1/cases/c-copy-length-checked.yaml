id: hand-c-copy-length-checked
source: handmade
language: c
candidate:
  scanner: semgrep
  rule_id: c.lang.security.insecure-use-string-copy-fn
  category: sast
  message: Review the security-sensitive operation in its surrounding context.
  path: app/c_copy_length_checked.c
  start_line: 8
  end_line: 8
  severity_reported: high
  cwe:
  - CWE-120
code: |
  #include <stdio.h>
  #include <string.h>

  int main(int argc, char **argv) {
      if (argc != 2) return 1;
      char label[16];
      if (strlen(argv[1]) >= sizeof(label)) return 1;
      strcpy(label, argv[1]);
      puts(label);
      return 0;
  }
ground_truth:
  vulnerable: false
  cwe: []
  severity: none
  rationale: |
    The argument length is checked against the destination capacity before the copy.
    The strict less-than requirement leaves room for the terminating NUL. The input
    is a stable argv string and is not modified between the check and the copy.
