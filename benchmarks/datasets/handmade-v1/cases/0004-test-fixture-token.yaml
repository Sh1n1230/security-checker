code: |
  import pytest

  from myapp.client import Client

  # ローカルのスタブサーバ相手にしか使わない固定値
  TEST_TOKEN = "test-token-0000000000000000"


  @pytest.fixture
  def client(stub_server):
      return Client(base_url=stub_server.url, token=TEST_TOKEN)


  def test_client_sends_the_token(client, stub_server):
      client.ping()
      assert stub_server.last_request.headers["Authorization"] == f"Bearer {TEST_TOKEN}"
