# 真陽性: Origin をそのまま反射し、Cookie 付きリクエストを許可している。
id: hand-0095
source: handmade
language: javascript
candidate:
  scanner: semgrep
  rule_id: javascript.express.security.cors-misconfiguration
  category: sast
  message: CORS の設定が緩すぎます
  path: src/app.js
  start_line: 2
  end_line: 2
  severity_reported: medium
  cwe:
  - CWE-942
code: |
  app.use((req, res, next) => {
    res.setHeader("Access-Control-Allow-Origin", req.headers.origin || "*");
    res.setHeader("Access-Control-Allow-Credentials", "true");
    next();
  });

  app.get("/api/me", requireSession, (req, res) => res.json(req.user));
ground_truth:
  vulnerable: true
  cwe:
  - CWE-942
  severity: high
  rationale: |
    任意のオリジンを反射しつつ credentials を許可しているので、罠サイトの JavaScript から
    ログイン中の利用者の Cookie 付きで /api/me を読み出せる。個人情報やトークンが漏れる。
