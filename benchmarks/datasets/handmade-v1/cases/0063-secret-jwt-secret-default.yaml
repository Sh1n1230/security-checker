# 真陽性: JWT 署名鍵を環境変数が無いときの既定値として直書き。
id: hand-0063
source: handmade
language: javascript
candidate:
  scanner: gitleaks
  rule_id: generic-api-key
  category: secret
  message: シークレットらしき文字列が含まれています
  path: src/auth/jwt.js
  start_line: 3
  end_line: 3
  severity_reported: high
  cwe:
  - CWE-798
code: |
  const jwt = require("jsonwebtoken");

  const SECRET = process.env.JWT_SECRET || "dataset-placeholder-jwt-fallback";

  function issue(user) {
    return jwt.sign({ sub: user.id, role: user.role }, SECRET, { expiresIn: "1h" });
  }

  function verify(token) {
    return jwt.verify(token, SECRET);
  }

  module.exports = { issue, verify };
ground_truth:
  vulnerable: true
  cwe:
  - CWE-798
  severity: critical
  rationale: |
    環境変数の設定漏れがあると、リポジトリに公開された固定値で署名・検証される (値はデータセット用のダミーに置き換えてある)。
    攻撃者は role: admin を含むトークンを自由に偽造できる。既定値を置かず、未設定なら起動を止めるべき。
