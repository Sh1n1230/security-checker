# このファイルを検査したいリポジトリの .github/workflows/ にコピーして使う。
# 検査の手順は security-checker 本体の action.yml にあり、ここには呼び出しだけを書く。
# タグはあとから付け替えられるため、コミット SHA で固定する。<SHA> は次で調べられる:
#   git ls-remote https://github.com/Sh1n1230/security-checker refs/tags/v1.1.0
# Dependabot (package-ecosystem: github-actions) を入れておけば、新しいリリースに SHA ごと追随する。
name: Security Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF を Code Scanning にアップロードするため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Sh1n1230/security-checker@<SHA> # v1.1.0
        # with:
        #   min-score: 70        # このスコア未満なら失敗 (0 で判定しない)
        #   url: https://...     # 稼働中の Web サービスも検査する
        #   upload-sarif: false  # プライベートリポジトリで GitHub Advanced Security が無い場合
