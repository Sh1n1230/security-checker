[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-checker"
version = "2.0.0.dev0"
description = "拡張可能な AI Security Review プラットフォーム"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sh1n1230" }]
keywords = ["security", "sast", "llm", "code-review", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "httpx[http2]>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
google = ["google-genai"]
anthropic = ["anthropic"]
tiktoken = ["tiktoken"]
all = ["security-checker[openai,google,anthropic,tiktoken]"]

[project.scripts]
security-checker = "security_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Sh1n1230/security-checker"
Issues = "https://github.com/Sh1n1230/security-checker/issues"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "syrupy>=4",
  "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/security_checker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# 設計書内のコードブロックまで整形されないよう、対象を明示する
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
# 意図的に脆弱なサンプルは検査対象外 (直すと E2E テストの意味がなくなる)
extend-exclude = ["tests/fixtures/vulnerable-app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = "tests/fixtures/vulnerable-app"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["e2e: 実スキャナを起動する統合テスト (導入済みの場合のみ実行)"]

[tool.coverage.run]
source = ["src/security_checker"]
