[build-system]
# 版を固定する. ハッシュは uv.lock の build グループが持つ (下の [dependency-groups] と同じ版にする.
# tests/unit/test_scanner_versions.py が食い違いを検査する)
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "security-checker"
version = "2.1.0"
description = "AI security review: independent LLMs triage findings from semgrep, gitleaks, osv-scanner and trivy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sh1n1230" }]
keywords = ["security", "sast", "llm", "code-review", "sarif", "semgrep", "gitleaks", "github-actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpx[http2]>=0.28.1",
  "pydantic>=2.14.3",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.29.1",
  "rich>=13",
]

[project.optional-dependencies]
# LLM の SDK は extras にも置かない。内蔵アダプタは httpx だけで動き、SDK を使うコードは無い
# (入れても何も変わらない extras は誤解を招く) (設計書 §4)
tiktoken = ["tiktoken"]
# 外部のプラグイン作者向けの契約テスト (security_checker.testing) に要る
testing = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0"]
all = ["security-checker[tiktoken,testing]"]

[project.scripts]
security-checker = "security_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Sh1n1230/security-checker"
Documentation = "https://github.com/Sh1n1230/security-checker/tree/main/docs"
Changelog = "https://github.com/Sh1n1230/security-checker/blob/main/CHANGELOG.md"
Issues = "https://github.com/Sh1n1230/security-checker/issues"

[dependency-groups]
# ビルドバックエンド. build-system.requires はロックファイルの対象外なので、
# 同じ版をここにも書いてハッシュを uv.lock に固定し、リリースと Docker のビルドで検証する (#247)
build = ["hatchling==1.33.0"]
# CI の lint-ci ジョブが使う検査ツール
ci-lint = ["shellcheck-py==0.11.0.1", "zizmor==1.32.0"]
dev = [
  "jsonschema[format-nongpl]>=4.26.0",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.17.5",
  "syrupy>=7.0.2",
  "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/security_checker"]

# sdist に入れるのは、ビルドとテストに要るものだけ。開発用の設定 (.claude/・.github/)、
# 意図的に脆弱な評価データセット (benchmarks/)、配布用のサンプルや補助スクリプトは入れない。
# scripts/check-dist.py が CI で中身を確かめる
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/README.ja.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
# 意図的に脆弱なサンプル. sdist を展開して検査する利用者の誤検知の元になる
# (これを使う e2e テストは、実スキャナが入っている環境でだけ動く)
exclude = ["/tests/fixtures/vulnerable-app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# 設計書内のコードブロックまで整形されないよう、対象を明示する
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
# 意図的に脆弱なサンプルは検査対象外 (直すと E2E テストの意味がなくなる)
extend-exclude = ["tests/fixtures/vulnerable-app", "tests/fixtures/bundled-rules"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S",
  "D1",      # 公開している API には docstring を書く
  "ANN401",  # 引数を Any で受けない (mypy --strict の検査が効かなくなる)
  "ARG",     # 使わない引数
  "C90",     # 循環的複雑度
  "FBT",     # 真偽値はキーワードで渡す
  "FURB", "PERF", "PIE", "PYI", "RET501",
  "ISC",
  "PLC0207", "PLC0415", "PLR2004", "PLW2901",
  "PT018",
  "PTH201",
  "T20",     # 出力は Console か cli._emit を通す
  "TC",      # 型注釈にしか使わない import は TYPE_CHECKING の下に置く
]
ignore = [
  "S603", "S607",
  # __init__ の説明はクラスの docstring に書く。特殊メソッドは名前が仕様
  "D105", "D107",
]
# 日本語の文中で使う記号 (「transport × dialect」など) を誤検知させない
allowed-confusables = ["×", "－", "–"]

# 採用しないルールと理由:
# - EM / TRY003: 利用者向けの文言を例外で運び、cli._fail で 1 回だけ表示する設計。
#   文言を変数に分けても読みやすくならず、トレースバックを利用者に見せることもない (#686)
# - ERA001: 日本語の説明コメントの括弧や代入の例を、コメントアウトしたコードと誤検知する (#688)

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
# pydantic は実行時に型注釈を評価する。モデルのフィールドに使う型は TYPE_CHECKING に移さない
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "security_checker.config.schema.StrictModel",
  "security_checker.config.schema.ScannerConfig",
]

[tool.ruff.lint.per-file-ignores]
# テストは pytest の流儀に従う: assert・フィクスチャを受け取るだけの引数・期待値の数値・
# 真偽値の位置引数。docstring は必須にしない (テスト名が説明)
"tests/**" = ["S101", "D1", "ANN401", "ARG", "FBT", "PLR2004"]
# typer は関数の引数の型注釈と既定値を実行時に読んで CLI を組み立てる。
# オプションの真偽値の既定値 (FBT002) と、注釈に使う型の import (TC) はその書き方に従う
"src/security_checker/cli.py" = ["FBT002", "TC"]
# 方言と偽の実装は Protocol のシグネチャに合わせて引数を受け取る。使わない引数があってよい
"src/security_checker/providers/http/dialects/*.py" = ["ARG002"]
"src/security_checker/testing/fakes.py" = ["ARG002"]
# 契約テストはテストコードそのものを提供するモジュール
# (S108: シェル経由でないことを示すための固定パス。実際には作られないことを検証している)
"src/security_checker/testing/provider_contract.py" = ["S101", "S108"]
"src/security_checker/testing/scanner_contract.py" = ["S101", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = "tests/fixtures/(vulnerable-app|bundled-rules)"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["e2e: 実スキャナを起動する統合テスト (導入済みの場合のみ実行)"]

[tool.coverage.run]
source = ["src/security_checker"]
