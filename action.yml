# security-checker を GitHub Actions から呼ぶための composite action。
# 検査手順をここ 1 か所にまとめ、各リポジトリには呼び出しの数行だけを置く。
#
#   jobs:
#     security:
#       runs-on: ubuntu-latest
#       permissions:
#         contents: read
#         security-events: write # SARIF を Code Scanning に登録するため
#       steps:
#         - uses: actions/checkout@<SHA> # vX.Y.Z
#         - uses: Sh1n1230/security-checker@<SHA> # vX.Y.Z
#
# 検査対象はワークスペース全体。本体は $GITHUB_ACTION_PATH (ワークスペースの外) に展開されるため、
# security-checker 自身のファイルが検査対象に混ざることはない。
name: security-checker
description: gitleaks / semgrep / osv-scanner / trivy で検査してスコアを判定し、SARIF を Code Scanning に登録する
author: Sh1n1230
branding:
  icon: shield
  color: green

inputs:
  min-score:
    description: このスコア未満なら失敗させる (0 で判定しない)
    default: "70"
  url:
    description: 稼働中の Web サービスも検査する場合の URL
    default: ""
  upload-sarif:
    description: >-
      SARIF を GitHub Code Scanning に登録するか。
      プライベートリポジトリで GitHub Advanced Security が無い場合は false にする
    default: "true"
  token:
    description: スキャナの最新版を GitHub API で解決するときに使うトークン (レート制限の回避)
    default: ${{ github.token }}

outputs:
  score:
    description: 100 点満点のスコア
    value: ${{ steps.check.outputs.score }}
  rank:
    description: A / B / C / D のランク
    value: ${{ steps.check.outputs.rank }}

runs:
  using: composite
  steps:
    - name: スキャナをインストール
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq jq
        latest() { # latest <owner/repo> → 先頭の v を除いた最新のバージョン
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name | sed 's/^v//'
        }
        BIN="$RUNNER_TEMP/security-checker-bin"
        mkdir -p "$BIN"
        # gitleaks
        ver=$(latest gitleaks/gitleaks)
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
          | tar xz -C "$BIN" gitleaks
        # trivy
        # 公式 install.sh の `curl | sh` は使わない。取得したスクリプトを検証せず実行することになり、
        # セキュリティツール自身の推奨と矛盾するため。
        ver=$(latest aquasecurity/trivy)
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${ver}/trivy_${ver}_Linux-64bit.tar.gz" \
          | tar xz -C "$BIN" trivy
        # osv-scanner
        curl -fsSL -o "$BIN/osv-scanner" \
          https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
        chmod +x "$BIN/osv-scanner"
        # semgrep
        pipx install --quiet semgrep
        echo "$BIN" >> "$GITHUB_PATH"

    - name: セキュリティ検査を実行
      id: check
      shell: bash
      env:
        MIN_SCORE: ${{ inputs.min-score }}
        TARGET_URL: ${{ inputs.url }}
      run: |
        # 既定の shell は pipefail 無しのため、check.sh の失敗が tee に隠れる。
        # 「壊れているのに緑」を防ぐために必須。
        set -o pipefail
        args=(.)
        [[ "$MIN_SCORE" != "0" ]] && args+=(--min-score "$MIN_SCORE")
        [[ -n "$TARGET_URL" ]] && args+=(--url "$TARGET_URL")
        result="$RUNNER_TEMP/security-checker-result.txt"
        rc=0
        bash "$GITHUB_ACTION_PATH/check.sh" "${args[@]}" | tee "$result" || rc=$?
        {
          echo '## Security Check 結果'
          echo '```'
          cat "$result"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        summary="$GITHUB_ACTION_PATH/reports/summary.json"
        if [[ -f "$summary" ]]; then
          echo "score=$(jq -r .total_score "$summary")" >> "$GITHUB_OUTPUT"
          echo "rank=$(jq -r .rank "$summary")" >> "$GITHUB_OUTPUT"
        fi
        exit "$rc"

    # --- ここから Code Scanning 連携 ---
    # スコア判定で落ちても SARIF は出す (落ちた時ほど中身が見たい)
    - name: SARIF を生成
      if: always() && inputs.upload-sarif == 'true'
      id: sarif
      shell: bash
      run: |
        # GitHub の既定シェルは `bash -e` で、set -uo pipefail では解除されない。
        # このステップはスキャナの終了コードを自分で解釈するため -e を明示的に外す。
        # (osv-scanner の exit 128 = 対象マニフェスト無し で打ち切られる事故があった)
        set +e
        set -uo pipefail
        SARIF_DIR="$RUNNER_TEMP/sarif"
        mkdir -p "$SARIF_DIR"
        FAILED=""

        # 生成結果を検証する。空の SARIF をアップロードすると Code Scanning 上の既存 alert が
        # 「解決済み」として閉じられ、ツールの故障が「指摘ゼロ」に化ける。これは絶対に避ける。
        check() { # check <名前> <終了コード> <許容する終了コードのCSV>
          local name="$1" rc="$2" allowed="$3" out="$SARIF_DIR/$1.sarif"
          if [[ ",${allowed}," != *",${rc},"* ]] || ! jq -e '.runs[0].tool.driver.name' "$out" >/dev/null 2>&1; then
            echo "::error::${name} の SARIF 生成に失敗しました (exit ${rc})。誤って「指摘ゼロ」を登録しないよう、この結果はアップロードしません"
            rm -f "$out"
            FAILED="${FAILED} ${name}"
            return
          fi
          echo "- \`${name}\`: $(jq '.runs[0].results | length' "$out") 件" >> "$GITHUB_STEP_SUMMARY"
          # hashFiles() は GITHUB_WORKSPACE 外を見られないため、アップロード可否は出力で伝える
          echo "${name}=true" >> "$GITHUB_OUTPUT"
        }

        echo '## Code Scanning へ登録する SARIF' >> "$GITHUB_STEP_SUMMARY"

        semgrep scan --config p/default --sarif --quiet --metrics=off . > "$SARIF_DIR/semgrep.sarif"
        check semgrep $? 0

        # gitleaks 8.19+ は `dir`。`detect --no-git --source` は非推奨
        gitleaks dir . --report-format sarif \
          --report-path "$SARIF_DIR/gitleaks.sarif" --exit-code 0 >/dev/null 2>&1
        check gitleaks $? 0

        trivy fs --scanners misconfig,vuln,secret --format sarif --quiet \
          -o "$SARIF_DIR/trivy.sarif" .
        check trivy $? 0

        # osv-scanner: 0=脆弱性なし 1=脆弱性あり 128=対象のマニフェストが無い
        osv-scanner scan --recursive --format sarif . > "$SARIF_DIR/osv.sarif"
        osv_rc=$?
        if [[ "$osv_rc" == "128" ]]; then
          rm -f "$SARIF_DIR/osv.sarif"
          echo "- \`osv-scanner\`: 依存マニフェストが無いためスキップ" >> "$GITHUB_STEP_SUMMARY"
        else
          check osv "$osv_rc" 0,1
        fi

        if [[ -n "$FAILED" ]]; then
          echo "::error::SARIF を生成できなかったスキャナがあります:${FAILED}"
          exit 1
        fi

    # fork からの PR では GITHUB_TOKEN が read-only に降格され security-events: write が付かない。
    # アップロードは必ず失敗するので、明示的にスキップして理由を残す (黙って緑にしない)。
    - name: アップロード可否を判定
      if: always() && inputs.upload-sarif == 'true'
      id: ctx
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REPO" == "$REPO" ]]; then
          echo "upload=true" >> "$GITHUB_OUTPUT"
        else
          echo "upload=false" >> "$GITHUB_OUTPUT"
          {
            echo '> [!WARNING]'
            echo '> fork からの PR のため SARIF を Code Scanning にアップロードしていません。'
            echo '> 検出結果はこのジョブのログにのみ残ります。'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # category はツールごとに分ける。同じ category に別ツールの結果を上げると互いに上書きし合う。
    - name: SARIF をアップロード (semgrep)
      if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.semgrep == 'true'
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/sarif/semgrep.sarif
        category: semgrep

    - name: SARIF をアップロード (gitleaks)
      if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.gitleaks == 'true'
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/sarif/gitleaks.sarif
        category: gitleaks

    - name: SARIF をアップロード (trivy)
      if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.trivy == 'true'
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/sarif/trivy.sarif
        category: trivy

    - name: SARIF をアップロード (osv-scanner)
      if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.osv == 'true'
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/sarif/osv.sarif
        category: osv-scanner
