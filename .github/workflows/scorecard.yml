# OpenSSF Scorecard (https://github.com/ossf/scorecard)。
# このプロジェクト自体の運用 (トークン権限・依存の固定・ブランチ保護など) を継続的に採点し、
# 結果を Code Scanning (category: scorecard) に登録する。README のバッジは publish_results で公開した値。
# 構成は ossf/scorecard-action の公式サンプル (starter workflow) に合わせている。
name: Scorecard

on:
  # Branch-Protection の採点を最新に保つ
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ。書き込みはジョブで必要なものだけ与える
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Code Scanning への SARIF 登録
      id-token: write # publish_results (バッジと API) の OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 採点する
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 結果を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Code Scanning に登録
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
