# OpenSSF Scorecard (https://github.com/ossf/scorecard)。
# このプロジェクト自体の運用 (トークン権限・依存の固定・ブランチ保護など) を継続的に採点し、
# 結果を Code Scanning (category: scorecard) に登録する。README のバッジは publish_results で公開した値。
# 構成は ossf/scorecard-action の公式サンプル (starter workflow) に合わせている。
name: Scorecard

on:
  # Branch-Protection の採点を最新に保つ
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ。書き込みはジョブで必要なものだけ与える
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Code Scanning への SARIF 登録
      id-token: write # publish_results (バッジと API) の OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 採点する
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 結果を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Code Scanning に登録
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
