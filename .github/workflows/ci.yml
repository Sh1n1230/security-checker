# v2 (Python 実装) の CI。設計書 §25.4 で必須としたものを回す。
#   ruff check / ruff format --check / mypy --strict / pytest (カバレッジ 80%)
# 実 LLM は一切叩かない (設計書 §25 の原則)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # squash merge 後のコミットメッセージは PR タイトルになる (設計書 §31.1)。
  # release-please が CHANGELOG を生成できるよう、タイトルの形式をここで強制する。
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # PR タイトルの取得のみ。書き込みは与えない
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            chore
          # スコープは領域名。省略も許す (リポジトリ全体に及ぶ変更があるため)
          requireScope: false
          # 「feat: Add ...」のような大文字始まりを弾かない (日本語タイトルも許すため)
          subjectPattern: ".+"

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の classifiers に書いた版をすべて回す
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: 依存関係を同期
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check src tests

      - name: 型検査 (mypy --strict)
        run: uv run mypy

      - name: テスト
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  # classifiers は OS Independent なので、Linux 以外でもテストを回す (#50)。
  # lint と型検査は OS に依存しないので quality (Linux) だけで行い、ここではテストのみ。
  tests-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 依存関係を同期
        run: uv sync --group dev --frozen

      - name: テスト
        shell: bash
        # 失敗したテスト名を annotation に出す (ログを開かなくても PR の Checks で分かるように)
        run: |
          set -o pipefail
          uv run pytest -rfE 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do
              echo "::error title=pytest ($RUNNER_OS)::${line}"
            done
            exit 1
          }

  dogfooding:
    # 自分自身を scan にかける。ここが落ちても quality とは別問題として扱えるよう job を分ける。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: スキャナを導入
        run: |
          set -euo pipefail
          # action.yml と同じく、版と sha256 を固定して取得する (scripts/scanner-versions.sh)。
          # セルフスキャンの対象はこれまでどおり gitleaks と semgrep だけにするため、PATH には gitleaks だけを置く
          scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
          sudo install -m 0755 "$RUNNER_TEMP/scanners/gitleaks" /usr/local/bin/gitleaks

      - name: セルフスキャン
        # --strict: スキャナが失敗したら exit 3 で落とす (「壊れているのに緑」を作らない)
        run: uv run security-checker scan . --strict --fail-on critical

      - name: レポートを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-checker-report
          path: .security-checker/
          retention-days: 7

  docker:
    # Dockerfile (スキャナ同梱イメージ) が壊れていないことの確認。公開は release.yml が行う
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: イメージをビルドする
        run: docker build -t security-checker:ci .
      - name: 同梱スキャナで自分自身を検査する
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" security-checker:ci version
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" security-checker:ci \
            scan . --strict --fail-on critical -f json -q
