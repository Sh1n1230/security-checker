# リリース (設計書 §31.3)。
#   1. main への push ごとに release-please がリリース PR を作る / 更新する
#      (squash merge のコミットメッセージ = Conventional Commits の PR タイトルから CHANGELOG を作る)
#   2. リリース PR をマージするとタグと GitHub Release ができ、続けて配布物を公開する
#      - PyPI: Trusted Publishing (OIDC)。API トークンをリポジトリに置かない
#      - GHCR: スキャナ同梱の Docker イメージ (Dockerfile)
#
# 公開先の準備ができるまでは公開ジョブを止めておく (リポジトリ変数で明示的に有効化する):
#   - PyPI:  配布名を確保し (NEXT-STEPS D1)、PyPI 側で Trusted Publisher にこの workflow を登録してから
#            リポジトリ変数 PUBLISH_PYPI=true と environment "pypi" を作る
#   - GHCR:  リポジトリ変数 PUBLISH_GHCR=true
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # タグとリリースの作成
      pull-requests: write # リリース PR の作成・更新
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 同じコミットの CI が緑になるまで配布物を作らない。公開した版は取り消せない (#246)
  ci-passed:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read # CI の run の状態を読む
    steps:
      - name: このコミットの CI の完了を待つ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # push で起動した CI (ci.yml) を、コミットで探す。起動が遅れることがあるので、見つかるまでも待つ
          for _ in $(seq 1 110); do
            run="$(gh run list --workflow ci.yml --commit "$SHA" --event push \
              --json status,conclusion,url --jq '.[0] // empty')"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              echo "CI: $conclusion ($(jq -r .url <<<"$run"))"
              [[ "$conclusion" == "success" ]] && exit 0
              echo "::error::このコミットの CI が $conclusion のため、リリースを作りません"
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI が時間内に終わりませんでした"
          exit 1

  build:
    needs: [release-please, ci-passed]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # attestation の署名 (Sigstore)
      attestations: write # attestation の保存
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: 配布物を作る
        # ビルドバックエンド (hatchling) とその依存も、uv.lock の版とハッシュで検証する (#247)
        run: |
          set -euo pipefail
          uv export --only-group build --frozen --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/build-constraints.txt"
          uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-hashes
      - name: 配布物の中身を確かめる
        run: uv run --no-project python scripts/check-dist.py dist
      # どの workflow・コミットで作られたかの来歴。`gh attestation verify` で検証できる (SECURITY.md)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # GitHub Release に配布物を添付する。書き込み権限は、ビルドを実行しないこの job にだけ付ける
  release-assets:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # リリースへの添付
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: リリースに添付する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # --clobber は付けない. 同名の添付物があれば差し替えずに失敗させる
        run: gh release upload "$TAG" dist/*

  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC)。これ以外の権限は与えない
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  ghcr:
    needs: [release-please, ci-passed]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_GHCR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v2.0.0 → 2.0.0 / 2.0 / 2 (action.yml が将来 `:v2` を参照するため major タグも付ける)
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern=v{{major}},value=${{ needs.release-please.outputs.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
