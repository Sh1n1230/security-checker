# security-checker 自身を security-checker で検査する (dogfooding)。
# 他のリポジトリで使う場合は ci/security.yml (action.yml を呼ぶ数行のサンプル) をコピーすること。
#
# ジョブの役割:
#   security          v2 (action.yml)。PR コメント・集約 SARIF (category: security-checker)・ゲート
#   raw-sarif         v1 と同じ「各スキャナの生 SARIF」。LLM を通さない結果を P6 まで並べて上げ、
#                     security-checker との差分 (= LLM が潰した誤検出) を観察する (DESIGN.md §18.4.5)。
#                     P7 で空 SARIF を上げて閉じ、このジョブを消す
#   ps1-lint          contrib/host-audit/windows/*.ps1 の構文リント
name: Security Check

on:
  push:
    branches: [main, master]
  pull_request:

# 既定を最小権限にし、必要なジョブでのみ広げる
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR コメント
      security-events: write # SARIF を Code Scanning にアップロードするため
    steps:
      # 可変タグ (@v5) は指す先が後から変わるため SHA で固定する。
      # 実際 actions/checkout の v5 タグは 93cb6ef (v5.0.1) から fbc6f39 (v5.1.0) へ移動している。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff モードで merge-base を求めるのに必要
          persist-credentials: false

      # 検査手順はリポジトリ直下の action.yml に集約している (他のリポジトリと同じものを使う)
      - uses: ./

  raw-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: スキャナをインストール
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # action.yml と同じく、バージョンと sha256 を固定して取得する
          BIN="$RUNNER_TEMP/security-checker-bin"
          scripts/install-scanners.sh "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"


      - name: SARIF を生成
        if: always()
        id: sarif
        shell: bash
        run: |
          # GitHub の既定シェルは `bash -e` で、set -uo pipefail では解除されない。
          # このステップはスキャナの終了コードを自分で解釈するため -e を明示的に外す。
          # (osv-scanner の exit 128 = 対象マニフェスト無し で打ち切られる事故があった)
          set +e
          set -uo pipefail
          SARIF_DIR="$RUNNER_TEMP/sarif"
          mkdir -p "$SARIF_DIR"
          FAILED=""

          # 生成結果を検証する。空の SARIF をアップロードすると Code Scanning 上の既存 alert が
          # 「解決済み」として閉じられ、ツールの故障が「指摘ゼロ」に化ける。これは絶対に避ける。
          check() { # check <名前> <終了コード> <許容する終了コードのCSV>
            local name="$1" rc="$2" allowed="$3" out="$SARIF_DIR/$1.sarif"
            if [[ ",${allowed}," != *",${rc},"* ]] || ! jq -e '.runs[0].tool.driver.name' "$out" >/dev/null 2>&1; then
              echo "::error::${name} の SARIF 生成に失敗しました (exit ${rc})。誤って「指摘ゼロ」を登録しないよう、この結果はアップロードしません"
              rm -f "$out"
              FAILED="${FAILED} ${name}"
              return
            fi
            echo "- \`${name}\`: $(jq '.runs[0].results | length' "$out") 件" >> "$GITHUB_STEP_SUMMARY"
            # hashFiles() は GITHUB_WORKSPACE 外を見られないため、アップロード可否は出力で伝える
            echo "${name}=true" >> "$GITHUB_OUTPUT"
          }

          echo '## Code Scanning へ登録する SARIF' >> "$GITHUB_STEP_SUMMARY"

          semgrep scan --config p/default --sarif --quiet --metrics=off . > "$SARIF_DIR/semgrep.sarif"
          check semgrep $? 0

          # gitleaks 8.19+ は `dir`。`detect --no-git --source` は非推奨
          gitleaks dir . --report-format sarif \
            --report-path "$SARIF_DIR/gitleaks.sarif" --exit-code 0 >/dev/null 2>&1
          check gitleaks $? 0

          trivy fs --scanners misconfig,vuln,secret --format sarif --quiet \
            -o "$SARIF_DIR/trivy.sarif" .
          check trivy $? 0

          # osv-scanner: 0=脆弱性なし 1=脆弱性あり 128=対象のマニフェストが無い
          osv-scanner scan --recursive --format sarif . > "$SARIF_DIR/osv.sarif"
          osv_rc=$?
          if [[ "$osv_rc" == "128" ]]; then
            rm -f "$SARIF_DIR/osv.sarif"
            echo "- \`osv-scanner\`: 依存マニフェストが無いためスキップ" >> "$GITHUB_STEP_SUMMARY"
          else
            check osv "$osv_rc" 0,1
          fi

          if [[ -n "$FAILED" ]]; then
            echo "::error::SARIF を生成できなかったスキャナがあります:${FAILED}"
            exit 1
          fi

      # fork からの PR では GITHUB_TOKEN が read-only に降格され security-events: write が付かない。
      # アップロードは必ず失敗するので、明示的にスキップして理由を残す (黙って緑にしない)。
      - name: アップロード可否を判定
        if: always()
        id: ctx
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REPO" == "$REPO" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            {
              echo '> [!WARNING]'
              echo '> fork からの PR のため SARIF を Code Scanning にアップロードしていません。'
              echo '> 検出結果はこのジョブのログにのみ残ります。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # category はツールごとに分ける。同じ category に別ツールの結果を上げると互いに上書きし合う。
      - name: SARIF をアップロード (semgrep)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.semgrep == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/semgrep.sarif
          category: semgrep

      - name: SARIF をアップロード (gitleaks)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.gitleaks == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/gitleaks.sarif
          category: gitleaks

      - name: SARIF をアップロード (trivy)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.trivy == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy.sarif
          category: trivy

      - name: SARIF をアップロード (osv-scanner)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.osv == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/osv.sarif
          category: osv-scanner

  ps1-lint:
    runs-on: ubuntu-latest # pwsh は ubuntu ランナーに同梱されている
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 全 .ps1 の構文リント
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          $hasError = $false
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hasError = $true
              Write-Host "::error file=$($f.FullName)::構文エラーが $($errors.Count) 件あります"
              foreach ($e in $errors) { Write-Host "  $($e.Message) (line $($e.Extent.StartLineNumber))" }
            }
          }
          if ($hasError) { exit 1 }
          Write-Host "OK: $($files.Count) 個の .ps1 に構文エラーはありません"
