# security-checker 自身を security-checker で検査する (dogfooding)。
# 他のリポジトリで使う場合は ci/security.yml をコピーすること。
#
# このワークフローは 2 つの役割を持つ。
#   1. check.sh によるスコア判定 (min-score 70 未満で落ちる) = ゲート
#   2. 各スキャナの SARIF を GitHub Code Scanning に登録 = 可視化と履歴
# 2 は v2 で「security-checker が集約した単一の SARIF」に置き換わる (docs/DESIGN.md §18.4)。
name: Security Check

on:
  push:
    branches: [main, master]
  pull_request:

# 既定を最小権限にし、必要なジョブでのみ広げる
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF を Code Scanning にアップロードするため
    steps:
      # 可変タグ (@v5) は指す先が後から変わるため SHA で固定する。
      # 実際 actions/checkout の v5 タグは 93cb6ef (v5.0.1) から fbc6f39 (v5.1.0) へ移動している。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: ツールをインストール
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          # gitleaks (最新版をGitHub APIから解決)
          GITLEAKS_VER=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          # semgrep
          pipx install semgrep
          # osv-scanner
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/
          # trivy
          # 公式 install.sh の `curl | sh` は使わない。取得したスクリプトを検証せず root 権限で
          # 実行することになり、セキュリティツール自身の推奨と矛盾するため。
          TRIVY_VER=$(curl -sSL https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" | tar xz trivy
          sudo mv trivy /usr/local/bin/

      - name: セキュリティ検査を実行
        run: |
          # 既定の shell は pipefail 無しのため、check.sh の失敗が tee に隠れる。
          # 「壊れているのに緑」を防ぐために必須。
          set -o pipefail
          bash check.sh . --min-score 70 | tee result.txt
          echo '## Security Check 結果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat result.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- ここから Code Scanning 連携 ---
      # スコア判定で落ちても SARIF は出す (落ちた時ほど中身が見たい)
      - name: SARIF を生成
        if: always()
        id: sarif
        run: |
          # GitHub の既定シェルは `bash -e` で、set -uo pipefail では解除されない。
          # このステップはスキャナの終了コードを自分で解釈するため -e を明示的に外す。
          # (osv-scanner の exit 128 = 対象マニフェスト無し で打ち切られる事故があった)
          set +e
          set -uo pipefail
          SARIF_DIR="$RUNNER_TEMP/sarif"
          mkdir -p "$SARIF_DIR"
          FAILED=""

          # 生成結果を検証する。空の SARIF をアップロードすると Code Scanning 上の既存 alert が
          # 「解決済み」として閉じられ、ツールの故障が「指摘ゼロ」に化ける。これは絶対に避ける。
          check() { # check <名前> <終了コード> <許容する終了コードのCSV>
            local name="$1" rc="$2" allowed="$3" out="$SARIF_DIR/$1.sarif"
            if [[ ",${allowed}," != *",${rc},"* ]] || ! jq -e '.runs[0].tool.driver.name' "$out" >/dev/null 2>&1; then
              echo "::error::${name} の SARIF 生成に失敗しました (exit ${rc})。誤って「指摘ゼロ」を登録しないよう、この結果はアップロードしません"
              rm -f "$out"
              FAILED="${FAILED} ${name}"
              return
            fi
            echo "- \`${name}\`: $(jq '.runs[0].results | length' "$out") 件" >> "$GITHUB_STEP_SUMMARY"
            # hashFiles() は GITHUB_WORKSPACE 外を見られないため、アップロード可否は出力で伝える
            echo "${name}=true" >> "$GITHUB_OUTPUT"
          }

          echo '## Code Scanning へ登録する SARIF' >> "$GITHUB_STEP_SUMMARY"

          semgrep scan --config p/default --sarif --quiet --metrics=off . > "$SARIF_DIR/semgrep.sarif"
          check semgrep $? 0

          # gitleaks 8.19+ は `dir`。`detect --no-git --source` は非推奨
          gitleaks dir . --report-format sarif \
            --report-path "$SARIF_DIR/gitleaks.sarif" --exit-code 0 >/dev/null 2>&1
          check gitleaks $? 0

          trivy fs --scanners misconfig,vuln,secret --format sarif --quiet \
            -o "$SARIF_DIR/trivy.sarif" .
          check trivy $? 0

          # osv-scanner: 0=脆弱性なし 1=脆弱性あり 128=対象のマニフェストが無い
          osv-scanner scan --recursive --format sarif . > "$SARIF_DIR/osv.sarif"
          osv_rc=$?
          if [[ "$osv_rc" == "128" ]]; then
            rm -f "$SARIF_DIR/osv.sarif"
            echo "- \`osv-scanner\`: 依存マニフェストが無いためスキップ" >> "$GITHUB_STEP_SUMMARY"
          else
            check osv "$osv_rc" 0,1
          fi

          if [[ -n "$FAILED" ]]; then
            echo "::error::SARIF を生成できなかったスキャナがあります:${FAILED}"
            exit 1
          fi

      # fork からの PR では GITHUB_TOKEN が read-only に降格され security-events: write が付かない。
      # アップロードは必ず失敗するので、明示的にスキップして理由を残す (黙って緑にしない)。
      - name: アップロード可否を判定
        if: always()
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || \
                "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            {
              echo '> [!WARNING]'
              echo '> fork からの PR のため SARIF を Code Scanning にアップロードしていません。'
              echo '> 検出結果はこのジョブのログにのみ残ります。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # category はツールごとに分ける。同じ category に別ツールの結果を上げると互いに上書きし合う。
      - name: SARIF をアップロード (semgrep)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.semgrep == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/sarif/semgrep.sarif
          category: semgrep

      - name: SARIF をアップロード (gitleaks)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.gitleaks == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/sarif/gitleaks.sarif
          category: gitleaks

      - name: SARIF をアップロード (trivy)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.trivy == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy.sarif
          category: trivy

      - name: SARIF をアップロード (osv-scanner)
        if: always() && steps.ctx.outputs.upload == 'true' && steps.sarif.outputs.osv == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/sarif/osv.sarif
          category: osv-scanner

  security-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 全 .ps1 の構文リント
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          $hasError = $false
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hasError = $true
              Write-Host "::error file=$($f.FullName)::構文エラーが $($errors.Count) 件あります"
              foreach ($e in $errors) { Write-Host "  $($e.Message) (line $($e.Extent.StartLineNumber))" }
            }
          }
          if ($hasError) { exit 1 }
          Write-Host "OK: $($files.Count) 個の .ps1 に構文エラーはありません"

      - name: ツールをインストール (GitHub releasesから直接取得)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:RUNNER_TEMP "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # gitleaks
          $ver = (Invoke-RestMethod "https://api.github.com/repos/gitleaks/gitleaks/releases/latest").tag_name.TrimStart("v")
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_windows_x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin -Force

          # trivy
          $ver = (Invoke-RestMethod "https://api.github.com/repos/aquasecurity/trivy/releases/latest").tag_name.TrimStart("v")
          $zip = Join-Path $env:RUNNER_TEMP "trivy.zip"
          Invoke-WebRequest -Uri "https://github.com/aquasecurity/trivy/releases/download/v$ver/trivy_${ver}_windows-64bit.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin -Force

          # osv-scanner
          Invoke-WebRequest -Uri "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_windows_amd64.exe" -OutFile (Join-Path $bin "osv-scanner.exe")

          # semgrep
          pip install semgrep

          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: セキュリティ検査を実行 (windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          pwsh ./check.ps1 . | Tee-Object -FilePath result.txt

          # ubuntuジョブでスコア判定は担保済みのため、ここでは結果ファイルの整合性のみ検証する
          $summaryPath = "reports/summary.json"
          if (-not (Test-Path $summaryPath)) {
            Write-Error "エラー: reports/summary.json が生成されていません"
            exit 1
          }
          $summary = Get-Content -Raw -Path $summaryPath | ConvertFrom-Json
          foreach ($key in @("total_score", "rank", "categories")) {
            if (-not ($summary.PSObject.Properties.Name -contains $key)) {
              Write-Error "エラー: summary.json に $key キーがありません"
              exit 1
            }
          }
          Write-Host "OK: summary.json に total_score=$($summary.total_score) rank=$($summary.rank) categories を確認"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Security Check 結果 (Windows)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Get-Content result.txt | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
