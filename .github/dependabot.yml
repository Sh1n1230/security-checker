# 依存の更新を自動で提案させる。セキュリティツール自身が古い依存を抱えないため。
version: 2
# 公開から 7 日未満の版は提案させない。乗っ取られたリリースは数日以内に見つかって取り下げられることが多い
# (scripts/scanner-versions.sh の「7 日以上経った版を選ぶ」と同じ考え方)。セキュリティ更新は対象外

updates:
  # GitHub Actions は SHA で固定しているため、人手では更新が漏れる。
  # dependabot は SHA ピン留めのまま追随してコメントのバージョン表記も直す。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      # 開発ツールはまとめて 1 PR にする (個別に来ると数が多い)
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "respx", "syrupy", "types-*"]

  # Dockerfile のベースイメージ (python) と uv のイメージ。digest 固定のまま追随する
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
