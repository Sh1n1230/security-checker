# frugal — コスト優先。候補数と文脈量を絞る。
version: 1
scanners:
  semgrep: { enabled: true, config: p/default }
  gitleaks: { enabled: true }
  osv: { enabled: true }
  trivy: { enabled: false }
context:
  window_lines: 20
  max_callers: 0
  max_tokens_per_task: 4000
budget:
  max_candidates: 30
  max_usd: 0.10
concurrency:
  reviews_per_provider: 2
policy:
  fail_on: high
  strict: false
output:
  formats: [terminal, json]
